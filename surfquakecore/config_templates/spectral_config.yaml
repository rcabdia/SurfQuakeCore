# =============================================================================
# CONTINUOUS WAVELET TRANSFORM (scalogram) - time-frequency map with a
# resolution that adapts to frequency (sharp in time at high frequencies,
# sharp in frequency at low frequencies)
#
#   wavelet : 'cm' complex Morlet (recommended), 'mh' Mexican hat, 'pa' Paul
#   param   : main wavelet parameter. 6.0 with 'cm' and 'pa', aligns scales with
#             Fourier frequencies.
#   fmin, fmax : frequency band analysed (Hz). fmax must be below Nyquist.
#   voices_per_octave: default 16, set the number of atoms in the CWT, log2 scale
# =============================================================================

#  process_1:
#    name: 'cwt'
#    wavelet: 'cm'
#    param: 6.0
#    fmin: 0.5
#    fmax: 8.0
#    voices_per_octave: 16
#    output_path: "/Users/admin/Desktop/surf_test/cut/spec"


# =============================================================================
# CROSS SPECTRUM - coherence and transfer function of every trace with
# respect to a reference trace (e.g. how a sensor responds to another one)
#
#   reference_idx   : position of the reference trace in the input (0 = first)
#   method          : 'welch'      -> average of overlapping windows
#                     'multitaper' -> average over tapers of the whole record
#   win             : window length in seconds (welch only). More windows ->
#                     more reliable coherence, but coarser frequency resolution.
#   overlap_percent : overlap between windows, in percent (welch only)
#   nw              : time-bandwidth product (multitaper only), typically 2-4
#
#   Coherence goes from 0 (unrelated) to 1 (perfectly linearly related).
# =============================================================================

#  process_1:
#    name: 'cross_spectrum'
#    reference_idx: 0
#    method: 'welch'
#    win: 20.0
#    overlap_percent: 75.0
#    nw: 4.0
#    output_path: "/surf_test/mti/spec_out"


# =============================================================================
# CEPSTRUM and CEPSTROGRAM - find repetitions in the signal (echoes, pulse
# trains, harmonic sounds such as ship propellers). A pattern that repeats
# every T seconds gives a peak at "quefrency" T (seconds).
#
#   kind : 'real'  -> keeps the sign; good for harmonic combs
#          'power' -> always positive; use it for echoes / multipath, where
#                     the reflection can make the peak negative in 'real'
#   (cepstrum only) 'complex' is also available
#
# Cepstrogram only (sliding windows, like the spectrogram):
#   win             : window length in seconds. Must hold several repetitions:
#                     the longest repetition period detectable is about win.
#   overlap_percent : overlap between windows, in percent
# =============================================================================

