# =============================================================================
# SurfQuake - spectral analysis configuration
#
# How to use this file
#   - Everything below "Analysis:" describes ONE analysis, called process_1.
#   - Exactly one example is active (uncommented). To use another one,
#     comment the active block and uncomment the block you want.
#   - Keep the indentation: 2 spaces before "process_1:", 4 before its keys.
#   - output_path : folder where the results are written (created if missing).
#
# Output files (Python objects, reload them later or plot with "surfquake specplot")
#   spectrum      -> <trace_id>.D.<year>.<julday>.sp
#   spectrogram   -> <trace_id>.D.<year>.<julday>.spec
#   cwt           -> <trace_id>.D.<year>.<julday>.cwt
#   cross_spectrum-> <ref_id>__<trace_id>.D.<year>.<julday>.coh
#   cepstrum      -> <trace_id>.D.<year>.<julday>.cep
#   cepstrogram   -> <trace_id>.D.<year>.<julday>.ceps
# =============================================================================

Analysis:

  # ---------------------------------------------------------------------------
  # SPECTROGRAM - how the spectrum changes with time (sliding windows)
  #
  #   win     : window length in seconds. Longer -> finer frequency resolution
  #             (about 1/win Hz) but coarser time resolution.
  #   overlap : overlap between consecutive windows, in percent (0-99).
  #   method  : 'fft'        -> fast, 5% cosine taper per window
  #             'multitaper' -> smoother, less noisy estimate (slower)
  # ---------------------------------------------------------------------------
  process_1:
    name: 'spectrogram'
    win: 3
    overlap: 50
    method: 'fft'
    output_path: "/Users/roberto/Desktop/test_input/config_templates/output_spec"


# =============================================================================
# SPECTRUM - amplitude spectrum of the whole trace
#
#   method : estimator used
#
#   Fourier methods (amplitude in the units of the trace)
#     'fft'         fast, 5% cosine taper; also stores the phase
#     'multitaper'  several tapers averaged: smoother, less noisy
#
#   Parametric methods (need the optional package:  pip install spectrum)
#   They fit a model to the samples and draw the spectrum from the model.
#   The data are NOT tapered or zero-padded.
#
#     method     what it gives                                  extra keys
#     --------   --------------------------------------------   -----------
#     burg       AR model, smooth spectrum (recommended)         order
#     yule       AR model, smoothest / lowest resolution         order
#     covar      AR model, covariance method                     order
#     modcovar   AR model, forward-backward covariance           order
#     minvar     minimum variance (Capon)                        order
#     music      pseudo-spectrum, only for detecting lines       order, nsig
#     ev         pseudo-spectrum, only for detecting lines       order, nsig
#
#   order : model order (default 20). Each spectral peak needs about 2 poles,
#           and the poles are spread from 0 Hz to Nyquist. To study low
#           frequencies (e.g. the microseism), decimate the traces first
#           rather than raising the order a lot. Capped at 1/3 of the samples.
#   nsig  : music / ev only, REQUIRED. 2 per pure tone you expect in the data
#           (1 tone -> 2, 3 tones -> 6). Must be smaller than order.
#           music / ev amplitudes have no physical units: compare where the
#           peaks are, not how high they are.
# =============================================================================

