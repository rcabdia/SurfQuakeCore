# =============================================================================
#  SurfQuake - generate synthetic traces from a config file (no -w needed)
# =============================================================================
#
#  Run
#  ---
#    surfquake quick -c synthetic_source_config.yaml                 # generate + plot
#    surfquake quick -c synthetic_source_config.yaml -o ./out -a     # generate + write files
#
#  Every entry of the 'Source' section (trace_1, trace_2, ...) creates ONE
#  trace. Traces are created in numerical order. This file can be run as it is:
#  it creates the 13 traces below, one per signal type. Delete the entries you
#  do not need.
#
#  An optional 'Analysis' section in the same file (rmean, filter, taper,
#  cross_correlate...) processes the generated traces exactly as it would
#  process real ones. See the examples at the bottom.
#
#  Header fields (they identify the trace, the same way as in real data)
#  ---------------------------------------------------------------------
#    network      Code of the seismic network, 1-2 characters (e.g. 'IU', 'ES').
#                 'XX' is commonly used for temporary or test networks.
#    station      Station code, 1-5 characters. Use a DIFFERENT code for each
#                 trace: output files are named network.station.location.channel,
#                 so this is how you tell the synthetic signals apart later.
#    location     Location code, 0-2 characters; it distinguishes several
#                 sensors at the same station. Usually empty: ''
#    channel      Channel code, exactly 3 characters: band + instrument +
#                 orientation. 'BHZ' = Broad band, High-gain seismometer,
#                 Z (vertical). Others: HHZ, BHN (north), BHE (east).
#    starttime    UTC time of the FIRST sample, 'YYYY-MM-DDTHH:MM:SS'. Written
#                 in the output file name (year and day of year). If you will
#                 combine the signal with real data later, use a time inside
#                 the real data window, because steps that work on several
#                 traces need them to overlap in time. Default: 1970-01-01.
#    sampling_rate  Samples per second in Hz       (default 100.0)
#    duration       Length of the trace in seconds (default 60.0)
#
#  Signal fields
#  -------------
#    signal_type  impulse | impulse_train | step | boxcar | triangle | sine |
#                 line | quadratic | cubic | random | ricker | chirp |
#                 damped_sine
#    The remaining keys are the parameters of that signal (see each entry).
#
#  Rules for the signal parameters
#  -------------------------------
#    * Times ('time') are in SECONDS counted from the first sample, and must
#      lie inside the trace (0 <= time <= duration).
#    * Sample indices ('sample', 'samples') start at 0 and must lie inside the
#      trace (0 to duration * sampling_rate - 1).
#    * Frequencies are in Hz and must not exceed the Nyquist frequency
#      (sampling_rate / 2).
#    * Phases are in DEGREES.
#
# =============================================================================

Source:

  # ---------------------------------------------------------------------------
  # 1. IMPULSE : a single spike, zero everywhere else
  # ---------------------------------------------------------------------------
  trace_1:
    network: 'XX'
    station: 'IMP'
    location: ''
    channel: 'BHZ'
    starttime: '2024-01-01T00:00:00'
    sampling_rate: 100.0
    duration: 60.0
    signal_type: 'impulse'
    amplitude: 1.0        # height of the spike                     (default 1.0)
    sample: 3000          # sample index of the spike; omit it to place the
                          # spike in the middle of the trace

  # ---------------------------------------------------------------------------
  # 2. IMPULSE_TRAIN : several spikes at chosen samples
  # ---------------------------------------------------------------------------
  trace_2:
    network: 'XX'
    station: 'TRN'
    location: ''
    channel: 'BHZ'
    starttime: '2024-01-01T00:00:00'
    sampling_rate: 100.0
    duration: 60.0
    signal_type: 'impulse_train'
    samples: [1000, 2000, 3000, 4000]   # sample index of each spike (integers)
    amplitudes: [1.0, 0.5, -1.0, 2.0]   # one amplitude per spike, or a single
                                        # number to use it for all of them

  # ---------------------------------------------------------------------------
  # 3. STEP : 0 in the first half of the trace, 'amplitude' in the second half
  # ---------------------------------------------------------------------------
  trace_3:
    network: 'XX'
    station: 'STP'
    location: ''
    channel: 'BHZ'
    starttime: '2024-01-01T00:00:00'
    sampling_rate: 100.0
    duration: 60.0
    signal_type: 'step'
    amplitude: 1.0        #                                          (default 1.0)

  # ---------------------------------------------------------------------------
  # 4. BOXCAR : rectangular pulse between 1/3 and 2/3 of the trace
  # ---------------------------------------------------------------------------
  trace_4:
    network: 'XX'
    station: 'BOX'
    location: ''
    channel: 'BHZ'
    starttime: '2024-01-01T00:00:00'
    sampling_rate: 100.0
    duration: 60.0
    signal_type: 'boxcar'
    amplitude: 1.0        #                                          (default 1.0)

  # ---------------------------------------------------------------------------
  # 5. TRIANGLE : ramps up from 25% to 50% of the trace (peak = amplitude) and
  #    back down to zero at 75%
  # ---------------------------------------------------------------------------
  trace_5:
    network: 'XX'
    station: 'TRI'
    location: ''
    channel: 'BHZ'
    starttime: '2024-01-01T00:00:00'
    sampling_rate: 100.0
    duration: 60.0
    signal_type: 'triangle'
    amplitude: 1.0        #                                          (default 1.0)

  # ---------------------------------------------------------------------------
  # 6. SINE : amplitude * sin(2*pi*frequency*t + phase)
  # ---------------------------------------------------------------------------
  trace_6:
    network: 'XX'
    station: 'SIN'
    location: ''
    channel: 'BHZ'
    starttime: '2024-01-01T00:00:00'
    sampling_rate: 100.0
    duration: 60.0
    signal_type: 'sine'
    frequency: 2.0        # Hz, up to Nyquist                          (default 1.0)
    phase: 0.0            # degrees                                    (default 0.0)
    amplitude: 1.0        #                                          (default 1.0)

  # ---------------------------------------------------------------------------
  # 7. LINE : slope * t + intercept  (a linear trend, useful to test 'rmean')
  # ---------------------------------------------------------------------------
  trace_7:
    network: 'XX'
    station: 'LIN'
    location: ''
    channel: 'BHZ'
    starttime: '2024-01-01T00:00:00'
    sampling_rate: 100.0
    duration: 60.0
    signal_type: 'line'
    slope: 0.5            # units per second                           (default 1.0)
    intercept: 2.0        # value at t = 0                             (default 0.0)

  # ---------------------------------------------------------------------------
  # 8. QUADRATIC : a*t^2 + b*t + c
  # ---------------------------------------------------------------------------
  trace_8:
    network: 'XX'
    station: 'QUA'
    location: ''
    channel: 'BHZ'
    starttime: '2024-01-01T00:00:00'
    sampling_rate: 100.0
    duration: 60.0
    signal_type: 'quadratic'
    a: 0.01               #                                          (default 1.0)
    b: 0.0                #                                          (default 0.0)
    c: 0.0                #                                          (default 0.0)

  # ---------------------------------------------------------------------------
  # 9. CUBIC : a*t^3 + b*t^2 + c*t + d
  # ---------------------------------------------------------------------------
  trace_9:
    network: 'XX'
    station: 'CUB'
    location: ''
    channel: 'BHZ'
    starttime: '2024-01-01T00:00:00'
    sampling_rate: 100.0
    duration: 60.0
    signal_type: 'cubic'
    a: 0.001              #                                          (default 1.0)
    b: 0.0                #                                          (default 0.0)
    c: 0.0                #                                          (default 0.0)
    d: 0.0                #                                          (default 0.0)

  # ---------------------------------------------------------------------------
  # 10. RANDOM : Gaussian white noise
  # ---------------------------------------------------------------------------
  trace_10:
    network: 'XX'
    station: 'RND'
    location: ''
    channel: 'BHZ'
    starttime: '2024-01-01T00:00:00'
    sampling_rate: 100.0
    duration: 60.0
    signal_type: 'random'
    mean: 0.0             #                                          (default 0.0)
    std: 1.0              # standard deviation, must be >= 0           (default 1.0)
    seed: 42              # integer -> same noise on every run (reproducible)
                          # null    -> different noise on every run

  # ---------------------------------------------------------------------------
  # 11. RICKER : zero-phase wavelet (second derivative of a Gaussian)
  # ---------------------------------------------------------------------------
  trace_11:
    network: 'XX'
    station: 'RCK'
    location: ''
    channel: 'BHZ'
    starttime: '2024-01-01T00:00:00'
    sampling_rate: 100.0
    duration: 60.0
    signal_type: 'ricker'
    frequency: 5.0        # central frequency in Hz, up to Nyquist     (default 5.0)
    time: 30.0            # seconds from the start of the trace at which the
                          # wavelet peaks; null -> middle of the trace
    amplitude: 1.0        # peak value                                 (default 1.0)

  # ---------------------------------------------------------------------------
  # 12. CHIRP : sine whose frequency sweeps from f0 (first sample) to f1 (last)
  # ---------------------------------------------------------------------------
  trace_12:
    network: 'XX'
    station: 'CHP'
    location: ''
    channel: 'BHZ'
    starttime: '2024-01-01T00:00:00'
    sampling_rate: 100.0
    duration: 60.0
    signal_type: 'chirp'
    f0: 1.0               # start frequency in Hz                      (default 1.0)
    f1: 20.0              # end frequency in Hz                        (default 20.0)
    method: 'linear'      # linear | quadratic | logarithmic | hyperbolic
                          # (logarithmic and hyperbolic need f0 and f1 != 0)
    amplitude: 1.0        #                                          (default 1.0)
    phase: 0.0            # initial phase in degrees                   (default 0.0)

  # ---------------------------------------------------------------------------
  # 13. DAMPED_SINE : amplitude * exp(-decay*tau) * sin(2*pi*frequency*tau + phase)
  #     with tau = t - time; the signal is zero before 'time'
  # ---------------------------------------------------------------------------
  trace_13:
    network: 'XX'
    station: 'DMP'
    location: ''
    channel: 'BHZ'
    starttime: '2024-01-01T00:00:00'
    sampling_rate: 100.0
    duration: 60.0
    signal_type: 'damped_sine'
    frequency: 8.0        # oscillation frequency in Hz                (default 8.0)
    decay: 0.5            # decay coefficient in 1/s, must be >= 0     (default 0.5)
    amplitude: 1.0        # initial amplitude                          (default 1.0)
    phase: 0.0            # degrees                                    (default 0.0)
    time: 10.0            # onset in seconds from the start of the trace
                          # (default 0.0; always give a number here, not null)

  # ---------------------------------------------------------------------------
  # 14. GAUSSIAN : bell-shaped pulse, amplitude * exp(-(t - time)^2 / (2*sigma^2))
  # ---------------------------------------------------------------------------
  trace_14:
    network: 'XX'
    station: 'GAU'
    location: ''
    channel: 'BHZ'
    starttime: '2024-01-01T00:00:00'
    sampling_rate: 100.0
    duration: 60.0
    signal_type: 'gaussian'
    sigma: 2.0            # standard deviation in seconds; the full width at half
                          # maximum is about 2.355 * sigma. Must be at least one
                          # sample interval (1 / sampling_rate)      (default 1.0)
    time: 30.0            # seconds from the start of the trace at which the pulse
                          # peaks; null -> middle of the trace
    amplitude: 1.0        # peak value                                 (default 1.0)

# =============================================================================
#  EXAMPLES WITH AN 'Analysis' SECTION - copy one block INSTEAD of the
#  'Source' section above, then uncomment it (remove the leading '# ').
# =============================================================================
#
